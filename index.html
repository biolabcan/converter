<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN STUDIO — Evrensel Dönüştürücü Konsolu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
            letter-spacing: -0.015em;
            touch-action: manipulation;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body class="bg-zinc-100 text-zinc-900 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Sağ Üst Durum Bildirimleri (Toasts) -->
    <div id="toastContainer" class="fixed top-4 left-4 right-4 sm:left-auto sm:right-5 sm:top-5 z-50 flex flex-col gap-2.5 max-w-sm pointer-events-none mx-auto sm:mx-0"></div>

    <div class="w-full max-w-md sm:max-w-xl bg-white border border-zinc-200/90 rounded-3xl p-5 sm:p-7 shadow-[0_18px_40px_rgba(0,0,0,0.06)] relative">
        
        <!-- Logo Yazısı (Mükemmel boşluk ayarlı) -->
        <div class="flex justify-center items-center mb-4 sm:mb-5">
            <span class="text-xs font-black tracking-normal text-zinc-800 uppercase" style="word-spacing: 0.12em;">CAN STUDIO</span>
        </div>

        <div class="text-center mb-5 sm:mb-6">
            <h1 class="text-xl sm:text-2xl font-black tracking-tight mb-1 text-zinc-950">Evrensel Dönüştürme Konsolu</h1>
            <p class="text-xs text-zinc-500 font-medium px-2">Toplu dosya yükle, hedef formatı seç ve saniyeler içinde indir.</p>
        </div>

        <!-- Hedef Format Seçimi -->
        <div class="mb-5">
            <label class="block text-xs font-bold text-zinc-700 mb-2">Hedef Formatı Seçin:</label>
            <div class="grid grid-cols-4 gap-2">
                <button type="button" onclick="setTargetFormat(this, 'webp')" data-format="webp" class="format-btn bg-zinc-100 hover:bg-zinc-200 text-zinc-900 text-xs py-3 rounded-2xl transition-all font-bold tracking-tight border border-zinc-200 text-center cursor-pointer">WebP</button>
                <button type="button" onclick="setTargetFormat(this, 'png')" data-format="png" class="format-btn bg-zinc-100 hover:bg-zinc-200 text-zinc-900 text-xs py-3 rounded-2xl transition-all font-bold tracking-tight border border-zinc-200 text-center cursor-pointer">PNG</button>
                <button type="button" onclick="setTargetFormat(this, 'jpg')" data-format="jpg" class="format-btn bg-zinc-100 hover:bg-zinc-200 text-zinc-900 text-xs py-3 rounded-2xl transition-all font-bold tracking-tight border border-zinc-200 text-center cursor-pointer">JPG</button>
                <button type="button" onclick="setTargetFormat(this, 'pdf')" data-format="pdf" class="format-btn bg-zinc-100 hover:bg-zinc-200 text-zinc-900 text-xs py-3 rounded-2xl transition-all font-bold tracking-tight border border-zinc-200 text-center cursor-pointer">PDF</button>
            </div>
        </div>

        <!-- Dosya Yükleme Kutusu -->
        <div id="dropZone" onclick="document.getElementById('fileInput').click()" 
             class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-300 hover:border-zinc-400 rounded-2xl p-5 sm:p-6 cursor-pointer bg-zinc-50/50 transition-all mb-4 relative overflow-hidden min-h-[130px]">
            
            <div id="uploadContent" class="flex flex-col items-center justify-center w-full text-center">
                <svg class="w-7 h-7 text-zinc-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                <span class="text-xs sm:text-sm text-zinc-800 font-bold mb-1">Dosyaları eklemek için tıkla veya sürükle</span>
                <span class="text-[11px] sm:text-xs text-zinc-400 font-medium">Canlı önizleme ve çoklu kuyruk desteklenir</span>
            </div>

            <div id="fileListContainer" class="hidden w-full flex flex-col gap-2 max-h-48 overflow-y-auto pr-1 z-10"></div>

            <input type="file" id="fileInput" class="hidden" multiple>
        </div>

        <!-- Durum Paneli -->
        <div class="bg-zinc-100/80 rounded-2xl p-3 sm:p-3.5 mb-4 text-xs border border-zinc-200/80 flex justify-between items-center gap-2">
            <span id="statusText" class="text-zinc-700 font-bold truncate">Sistem Hazır. Dosya ve format seçiniz.</span>
            <span id="fileCountBadge" class="text-zinc-500 font-mono text-[11px] font-bold shrink-0">0 Dosya</span>
        </div>

        <!-- Aksiyon Butonu -->
        <button id="convertBtn" onclick="startConversion()" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white font-bold py-3.5 rounded-2xl transition-all text-sm cursor-pointer shadow-md active:scale-[0.99] flex items-center justify-center gap-2">
            <span id="btnText">Dönüştürmeyi Başlat ve İndir</span>
        </button>

        <div class="mt-4 flex justify-end items-center text-xs">
            <button onclick="clearAll()" class="text-zinc-400 hover:text-zinc-700 font-bold transition cursor-pointer">Sıfırla</button>
        </div>
    </div>

    <script>
        let selectedFormat = null;
        let selectedFiles = [];
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('statusText');
        const fileCountBadge = document.getElementById('fileCountBadge');
        const uploadContent = document.getElementById('uploadContent');
        const fileListContainer = document.getElementById('fileListContainer');
        const toastContainer = document.getElementById('toastContainer');
        const dropZone = document.getElementById('dropZone');
        const convertBtn = document.getElementById('convertBtn');
        const btnText = document.getElementById('btnText');

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const isSuccess = type === 'success';
            
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl text-xs font-bold border transition-all duration-300 translate-y-2 sm:translate-y-0 sm:translate-x-10 opacity-0 ${
                isSuccess ? 'bg-zinc-900 text-white border-zinc-800' : 'bg-red-600 text-white border-red-500'
            }`;
            
            toast.innerHTML = `<span>${isSuccess ? '✨' : '⚠️'}</span><span>${message}</span>`;
            toastContainer.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-2', 'sm:translate-x-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'sm:translate-x-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function setTargetFormat(btn, format) {
            selectedFormat = format;

            document.querySelectorAll('.format-btn').forEach(b => {
                b.className = "format-btn text-xs py-3 rounded-2xl transition-all font-bold tracking-tight border border-zinc-200 text-center cursor-pointer bg-zinc-100 hover:bg-zinc-200 text-zinc-900";
            });

            btn.className = "format-btn text-xs py-3 rounded-2xl transition-all font-bold tracking-tight border border-zinc-950 text-center cursor-pointer shadow-sm bg-zinc-950 text-white";
            
            if(selectedFiles.length > 0) {
                statusText.innerHTML = `${selectedFiles.length} dosya kuyrukta. Hedef: <strong class="font-black">${format.toUpperCase()}</strong>`;
            } else {
                statusText.innerHTML = `Hedef seçildi: <strong class="font-black">${format.toUpperCase()}</strong>. Lütfen dosya yükleyin.`;
            }
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('border-zinc-900', 'bg-zinc-100');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-zinc-900', 'bg-zinc-100');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFiles(Array.from(e.dataTransfer.files));
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(Array.from(e.target.files));
                fileInput.value = '';
            }
        });

        function handleFiles(newFiles) {
            let addedCount = 0;
            newFiles.forEach(newFile => {
                if (!selectedFiles.some(f => f.name === newFile.name && f.size === newFile.size)) {
                    selectedFiles.push(newFile);
                    addedCount++;
                }
            });

            if(addedCount > 0) {
                showToast(`${addedCount} dosya kuyruğa eklendi.`);
            }
            renderFileList();
        }

        function removeFile(index, event) {
            event.stopPropagation();
            const removed = selectedFiles.splice(index, 1);
            showToast(`${removed[0].name} listeden çıkarıldı.`);
            
            if (selectedFiles.length === 0) {
                clearAll();
            } else {
                renderFileList();
            }
        }

        function renderFileList() {
            uploadContent.classList.add('hidden');
            fileListContainer.classList.remove('hidden');
            fileListContainer.innerHTML = '';

            selectedFiles.forEach((file, index) => {
                const ext = file.name.split('.').pop().toUpperCase();
                const sizeKB = (file.size / 1024).toFixed(1) + " KB";
                
                const card = document.createElement('div');
                card.className = "flex items-center justify-between w-full bg-white border border-zinc-200 rounded-xl p-2.5 shadow-xs text-zinc-900";
                
                let previewHTML = `<div class="bg-zinc-900 text-white text-[9px] font-black uppercase px-2 py-1 rounded-md font-mono shrink-0">${ext}</div>`;
                
                if (file.type.startsWith('image/')) {
                    const objectUrl = URL.createObjectURL(file);
                    previewHTML = `<img src="${objectUrl}" class="w-9 h-9 object-cover rounded-lg border border-zinc-200 shrink-0">`;
                }

                card.innerHTML = `
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        ${previewHTML}
                        <div class="flex flex-col truncate text-left">
                            <span class="text-xs font-bold text-zinc-900 truncate">${file.name}</span>
                            <span class="text-[10px] text-zinc-400 font-medium">${sizeKB}</span>
                        </div>
                    </div>
                    <button type="button" onclick="removeFile(${index}, event)" class="text-xs text-zinc-400 hover:text-red-500 font-bold px-2.5 py-1 transition cursor-pointer">✕</button>
                `;
                fileListContainer.appendChild(card);
            });

            fileCountBadge.textContent = selectedFiles.length + " Dosya";
            if(selectedFormat) {
                statusText.innerHTML = `${selectedFiles.length} dosya kuyrukta. Hedef: <strong class="font-black">${selectedFormat.toUpperCase()}</strong>`;
            } else {
                statusText.textContent = `${selectedFiles.length} dosya kuyrukta. Lütfen hedef format seçin.`;
            }
        }

        async function startConversion() {
            if (selectedFiles.length === 0) {
                showToast("Lütfen önce en az bir dosya ekleyin!", "error");
                return;
            }
            if (!selectedFormat) {
                showToast("Lütfen hedef formatı seçin!", "error");
                return;
            }

            convertBtn.disabled = true;
            convertBtn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.innerHTML = `
                <svg class="spinner w-4 h-4 text-white inline-block mr-2" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Dönüştürülüyor...
            `;

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append("files", file);
            });
            formData.append("target_format", selectedFormat);

            statusText.textContent = "Dönüştürülüyor ve indiriliyor...";
            showToast("Dönüştürme işlemi başlatıldı...");

            try {
                const response = await fetch('/api/convert-batch', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || "Dönüştürme başarısız oldu.");
                }

                const disposition = response.headers.get('content-disposition');
                let filename = selectedFiles.length > 1 ? "can_studio_converted.zip" : (selectedFiles[0].name.substring(0, selectedFiles[0].name.lastIndexOf('.')) + "." + selectedFormat);
                
                if (disposition && disposition.includes('filename=')) {
                    filename = disposition.split('filename=')[1].replace(/["']/g, '');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();

                statusText.textContent = "Başarılı! Dosyalar indirildi.";
                showToast("Tüm dosyalar başarıyla dönüştürüldü ve indirildi! ✨");

                clearAll();

            } catch (err) {
                statusText.textContent = "Hata oluştu.";
                showToast("Hata: " + err.message, "error");
            } finally {
                convertBtn.disabled = false;
                convertBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.textContent = "Dönüştürmeyi Başlat ve İndir";
            }
        }

        function clearAll() {
            fileInput.value = '';
            selectedFiles = [];
            selectedFormat = null;
            uploadContent.classList.remove('hidden');
            fileListContainer.classList.add('hidden');
            fileListContainer.innerHTML = '';
            fileCountBadge.textContent = "0 Dosya";
            statusText.textContent = "Sistem Hazır. Dosya ve format seçiniz.";
            
            document.querySelectorAll('.format-btn').forEach(b => {
                b.className = "format-btn text-xs py-3 rounded-2xl transition-all font-bold tracking-tight border border-zinc-200 text-center cursor-pointer bg-zinc-100 hover:bg-zinc-200 text-zinc-900";
            });
        }
    </script>
</body>
</html>
